# Production compose file for the hosted instance, invoked by
# scripts/deploy/deploy.sh, never by the self-hoster quickstart in
# docker-compose.yml. Standalone rather than an overlay: compose merges
# list keys like `ports` by appending, so an overlay trying to bind
# loopback-only would end up with a duplicate publish and fail.
#
# The relay's 8080 is bound to 127.0.0.1 only, never the public interface -
# Caddy reaches it over the internal `edge` bridge network by container
# name regardless of this host-side binding, which exists only so
# deploy.sh's health gate can probe the relay directly from the box
# without going through Caddy or Cloudflare.
#
# Two variables are resolved at compose-parse time, not container runtime:
#   RELAY_IMAGE_REF the full image reference for this deploy, exported by
#                   deploy.sh. A tag (ghcr.io/kangentic/relay:sha-<...>)
#                   for a forward deploy, or a digest
#                   (ghcr.io/kangentic/relay@sha256:...) for a rollback -
#                   never a bare tag var interpolated after a hardcoded
#                   colon, since that shape cannot express a digest.
#   RELAY_HOSTNAME       read from --env-file /opt/relay/.env (stable, not secret)
#   RELAY_HOSTNAME_ALIAS same file. Both are required: Caddy only routes a
#                        Host header matching one of a site block's own
#                        addresses, so the short CNAME needs to be listed
#                        explicitly - pointing DNS at this box does not by
#                        itself make Caddy accept that Host.
services:
  relay:
    image: ${RELAY_IMAGE_REF:?RELAY_IMAGE_REF must be set}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - /opt/relay/.env
    # Metrics history for the /admin dashboard. A NAMED volume, not a host bind
    # mount: a bind mount arrives root-owned and the container runs USER node,
    # so it would fail in production only. Deploy and rollback both use
    # `up -d --force-recreate`, and the only prune is `docker image prune`, so
    # nothing in the deploy path removes this. A provision.sh server rebuild
    # does discard it; see infra/README.md.
    volumes:
      - relay_history:/var/lib/relay
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # The connection cap alone cannot bound the MAX_BUFFERED_BYTES tail, so
    # this container memory limit is the actual OOM control on a 2 GB box.
    # Do not remove it under the assumption MAX_CONNECTIONS already covers
    # memory - it does not.
    mem_limit: 1200m
    # Equal to mem_limit, which is how Docker says "no swap": left unset, "the
    # container can use as much swap as the --memory setting"
    # (https://docs.docker.com/engine/containers/resource_constraints/), and
    # the box has a 2 GB swapfile, so the relay could page up to another
    # 1200m. A paged-out heap page that a GC then touches is a stall measured
    # in disk reads. Over the limit, an OOM kill and a restart is the honest
    # failure; a relay that limps along swapping is not. Baseline on
    # 2026-10-07: memory.swap.current 3.9 MB, zero memory pressure stalls.
    memswap_limit: 1200m
    stop_grace_period: 20s
    # Room for CONNECTION_TRACE: one line per connection at roughly 13k
    # connections a day is about 8 MB a day, against the daemon default of
    # 10m x 3 from cloud-init. 20m x 5 keeps about twelve days, longer than
    # the 7 days of one-minute history a trace is read against.
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - edge

  caddy:
    # An exact version, not the floating `caddy:2.8`: a Caddy recreate should
    # never also be an unannounced Caddy upgrade. 2.8.4 is what production ran
    # under the floating tag, and what every Caddyfile here was validated
    # against (caddy adapt and a live run).
    image: caddy:2.8.4
    restart: unless-stopped
    # The config path is explicit because the config now lives in a mounted
    # directory rather than at the image's default /etc/caddy/Caddyfile.
    command: ["caddy", "run", "--config", "/etc/caddy/compose/Caddyfile.prod", "--adapter", "caddyfile"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - RELAY_HOSTNAME=${RELAY_HOSTNAME:?RELAY_HOSTNAME must be set}
      - RELAY_HOSTNAME_ALIAS=${RELAY_HOSTNAME_ALIAS:?RELAY_HOSTNAME_ALIAS must be set}
    # DIRECTORY mounts, never single files. A single-file bind mount pins the
    # inode it was created with, and git replaces a file it updates with a new
    # inode, so the box's Caddy read a stale Caddyfile.prod from 2026-07-22 on
    # and `caddy reload` re-read the stale copy every time. Found by comparing
    # sha256 and inode inside and outside the container on 2026-10-07. A
    # directory mount resolves names at open time, so a reload sees what git
    # checked out. Neither directory holds a secret: compose files and the
    # generated Cloudflare range list.
    volumes:
      - ./:/etc/caddy/compose:ro
      - ../cloudflare:/etc/caddy/cloudflare:ro
      - /opt/relay/secrets:/etc/caddy/origin:ro
      - caddy_data:/data
    # Caddy is the process that sends to Cloudflare, so its TCP settings are
    # the ones that govern the lossy edge-to-origin leg. Both are namespaced:
    # they change Caddy's netns and nothing else on the host.
    #
    # slow_start_after_idle=0: with the kernel default of 1, a connection
    # idle for one RTO restarts from the initial window ("time out the
    # congestion window after an idle period. Default: 1",
    # https://docs.kernel.org/networking/ip-sysctl.html). Relay traffic is
    # bursty by nature (idle tunnel, then a transcript), so every burst after
    # a pause paid slow start again.
    #
    # BBR instead of cubic: that leg measured 0.8% retransmits during a slow
    # patch, and cubic reads every loss as congestion and shrinks its window.
    # In a lab with this exact Caddy config, 15 ms delay and 0.8% loss, 2 MiB
    # bursts took p90 1224 ms (max 1889) under cubic and p90 198 ms (max 208)
    # under BBR, with no difference on a clean path (docs/latency.md).
    # tcp_bbr is a kernel module on the host; deploy.sh loads it and lists it
    # in modules-load.d BEFORE compose touches this service, because a
    # container cannot load modules itself and Docker refuses to start one
    # asking for a congestion control the kernel does not have.
    sysctls:
      - net.ipv4.tcp_slow_start_after_idle=0
      - net.ipv4.tcp_congestion_control=bbr
    networks:
      - edge
    depends_on:
      - relay

  # Cloudflare Tunnel A/B, opt-in only: a compose profile, so deploy.sh never
  # starts it and the public image's quickstart never sees it. It runs a
  # second hostname over cloudflared's outbound connections into Caddy's
  # internal :8081 site, so the same Caddy and relay serve both paths and the
  # only thing compared is the Cloudflare-to-origin leg. See infra/README.md,
  # "Cloudflare Tunnel A/B", for setup, the /admin rule, and tear-down.
  #
  # The token is a file placed by hand under /opt/relay/secrets, never a line
  # in /opt/relay/.env: that file is the relay's env_file, and the relay has
  # no business holding a credential for a tunnel it does not run.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.0
    profiles: ["tunnel-ab"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/etc/cloudflared/tunnel-token"]
    volumes:
      - /opt/relay/secrets/tunnel-token:/etc/cloudflared/tunnel-token:ro
    networks:
      - edge
    depends_on:
      - caddy

networks:
  edge:
    driver: bridge
    ipam:
      config:
        # Pinned deliberately: this exact subnet is what TRUSTED_PROXY_CIDRS
        # in /opt/relay/.env must match. Docker's default bridge subnet is
        # not guaranteed stable, and the relay only trusts CF-Connecting-IP
        # / X-Forwarded-For from a peer inside this range.
        - subnet: 172.31.240.0/24

volumes:
  caddy_data: {}
  relay_history: {}
